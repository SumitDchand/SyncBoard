services:
  mongodb:
    image: mongo:8.0
    container_name: syncboard-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: syncboard
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - syncboard-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syncboard-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGODB_URI: mongodb://mongodb:27017/syncboard
      JWT_ACCESS_SECRET: syncboard_prod_access_secret_change_in_production
      JWT_REFRESH_SECRET: syncboard_prod_refresh_secret_change_in_production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:8080
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 1000
      AUTH_RATE_LIMIT_MAX: 30
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - syncboard-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: syncboard-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - syncboard-network

volumes:
  mongodb_data:
    driver: local

networks:
  syncboard-network:
    driver: bridge

